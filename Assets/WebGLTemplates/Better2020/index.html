<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js">
    </script>
  </head>
  <body class="{{{ SPLASH_SCREEN_STYLE.toLowerCase() }}}">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
        <div id="unity-loading-bar">
            <div id="unity-logo"><img src="logo_main.png" alt="Logo"></div>
            <div class="loader-section">
                <div class="spinner-container">
                    <div class="spinner"><img src="loader.png" alt="Loading"></div>
                    <div class="spinner-inner"><img src="loader_inner.png" alt=""></div>
                </div>
                <div class="loading-text">Loading...</div>
            </div>
        </div>
    </div>
    <div id="unity-fullscreen-button" style="display: none;"></div>
    <script>
      //const invisibleButton = document.getElementById('invisible-button');
      const hideFullScreenButton = "{{{ HIDE_FULL_SCREEN_BUTTON }}}";
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      const config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
      };

      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const fullscreenButton = document.querySelector("#unity-fullscreen-button");
      const spinner = document.querySelector('.spinner');

      var MyGameInstance = null;

      function detectTelegramEnvironment() {
          const isMobileUA = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

          if (!(window.Telegram && window.Telegram.WebApp)) {
              return isMobileUA ? 'MobileWeb' : 'DesktopWeb';
          }

          const platform = (window.Telegram.WebApp.platform || '').toLowerCase();

          switch (platform) {
              case 'android':
              case 'ios':
                  return 'MobileClient';
              case 'macos':
              case 'tdesktop':
              case 'unigram':
                  return 'DesktopClient';
              case 'web':
              case 'weba':
              case 'webk':
                  return isMobileUA ? 'MobileWeb' : 'DesktopWeb';
              default:
                  if (platform.includes('desktop')) {
                      return 'DesktopClient';
                  }
                  if (platform.includes('web')) {
                      return isMobileUA ? 'MobileWeb' : 'DesktopWeb';
                  }
                  if (platform.includes('android') || platform.includes('ios')) {
                      return 'MobileClient';
                  }
          }

          return isMobileUA ? 'MobileWeb' : 'DesktopWeb';
      }

      /*invisibleButton.addEventListener('click', () => {
          invisibleButton.remove();
          console.log('Overlay button removed');
      });*/
      
      const canFullscreen = (function() {
        for (const key of [
            'exitFullscreen',
            'webkitExitFullscreen',
            'webkitCancelFullScreen',
            'mozCancelFullScreen',
            'msExitFullscreen',
          ]) {
          if (key in document) {
            return true;
          }
        }
        return false;
      }());

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          canvas.style.removeProperty('aspect-ratio');
          var meta = document.createElement('meta');
          meta.name = 'viewport';
          meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
          document.getElementsByTagName('head')[0].appendChild(meta);
          container.className = "unity-mobile";
          canvas.className = "unity-mobile";
      }

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      loadingCover.style.display = "";

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {

          if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
              if (window.Telegram && window.TelegramWebviewProxy) {
                  window.Telegram.WebApp.expand();
                  window.TelegramWebviewProxy.postEvent('web_app_request_fullscreen', '');
              }
          }

        createUnityInstance(canvas, config, (progress) => {
          // Progress callback - spinner continues spinning until fully loaded
        }).then((unityInstance) => {
          MyGameInstance = unityInstance;

          MyGameInstance.SendMessage('TelegramService', 'OnCreateUnityInstance');
            
          loadingCover.style.display = "none";

            if (canFullscreen) {
            if (!hideFullScreenButton) {
              fullscreenButton.style.display = "none";
            }
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };

            // if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            //
            //     if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            //         DeviceMotionEvent.requestPermission()
            //             .then(permissionState => {
            //                 if (permissionState === 'granted') {
            //                     console.log('Access to sensors granted.');
            //                 } else {
            //                     console.log('Access to sensors denied.');
            //                 }
            //             })
            //             .catch(console.error);
            //     } else {
            //         console.log('DeviceMotionEvent is not supported.');
            //     }
            // }
          }
        }).catch((message) => {
          alert(message);
        });
      };

      window.GetTelegramInitDataUnsafeUser = function() {
          var telegramId = '1234567890';
          var telegramUserName = 'TestUser';
          var initData = '';
          var startParam = '';  // Referral code from deep link
          
          // Debug: Log all Telegram WebApp data
          var debugInfo = 'Telegram WebApp Debug Info:\n';
          if (window.Telegram && window.Telegram.WebApp) {
              var webApp = window.Telegram.WebApp;
              debugInfo += 'Platform: ' + (webApp.platform || 'unknown') + '\n';
              debugInfo += 'Version: ' + (webApp.version || 'unknown') + '\n';
              debugInfo += 'initData: ' + (webApp.initData ? 'present (' + webApp.initData.length + ' chars)' : 'empty') + '\n';
              
              if (webApp.initDataUnsafe) {
                  debugInfo += 'initDataUnsafe.start_param: ' + (webApp.initDataUnsafe.start_param || 'none') + '\n';
                  debugInfo += 'initDataUnsafe.query_id: ' + (webApp.initDataUnsafe.query_id || 'none') + '\n';
                  if (webApp.initDataUnsafe.user) {
                      debugInfo += 'initDataUnsafe.user.id: ' + (webApp.initDataUnsafe.user.id || 'none') + '\n';
                      debugInfo += 'initDataUnsafe.user.username: ' + (webApp.initDataUnsafe.user.username || 'none') + '\n';
                  } else {
                      debugInfo += 'initDataUnsafe.user: none\n';
                  }
              } else {
                  debugInfo += 'initDataUnsafe: not available\n';
              }
          } else {
              debugInfo += 'Telegram.WebApp: NOT AVAILABLE\n';
          }
          
          console.log('[TelegramWebApp] ' + debugInfo);
          alert(debugInfo);
 
          if (window.Telegram && window.Telegram.WebApp) {
              if (window.Telegram.WebApp.initData) {
                  initData = window.Telegram.WebApp.initData;
                  alert("initData " + initData); 

                  // Parse initData string to extract user parameter
                  try {
                      var urlParams = new URLSearchParams(initData);
                      var userParam = urlParams.get('user');
                      
                      // First try to get start_param from initDataUnsafe (more reliable)
                      if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.start_param) {
                          startParam = window.Telegram.WebApp.initDataUnsafe.start_param;
                          console.log('[TelegramWebApp] Got start_param from initDataUnsafe: ' + startParam);
                      } else {
                          // Fallback: parse start_param from initData string
                          startParam = urlParams.get('start_param') || '';
                          console.log('[TelegramWebApp] Got start_param from initData string: ' + startParam);
                      }

                      if (userParam) {
                          // Decode URL-encoded string and parse JSON
                          var userData = JSON.parse(decodeURIComponent(userParam));

                          if (userData.id) {
                              telegramId = userData.id.toString();
                          }
                          if (userData.username) {
                              telegramUserName = userData.username;
                          }

                          // alert("Parsed - telegramId: " + telegramId + ", telegramUserName: " + telegramUserName);
                      } else {
                          // alert("User parameter not found in initData");
                      }
                  } catch (error) {
                      // alert("Error parsing initData: " + error.message);
                  }
              } else {
                  // Even if initData is empty, try to get start_param from initDataUnsafe
                  if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.start_param) {
                      startParam = window.Telegram.WebApp.initDataUnsafe.start_param;
                      console.log('[TelegramWebApp] Got start_param from initDataUnsafe (no initData): ' + startParam);
                  }
              }
          } else {
              // alert("Telegram not found, use default id");
          }

          // Send StartParam FIRST, before InitData, because InitData triggers authentication
          if (startParam) {
              console.log('[TelegramWebApp] Sending start_param to Unity: ' + startParam);
          } else {
              console.log('[TelegramWebApp] No start_param found (not a referral link)');
          }
          MyGameInstance.SendMessage('TelegramService', 'ReceiveStartParam', startParam);
          
          MyGameInstance.SendMessage('TelegramService', 'ReceiveUserId', telegramId);
          MyGameInstance.SendMessage('TelegramService', 'ReceiveUserName', telegramUserName);
          MyGameInstance.SendMessage('TelegramService', 'ReceiveInitData', initData);

          // Get contentSafeAreaInset top value (for Android close/burger buttons)
          var contentSafeAreaTop = 0;
          if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.contentSafeAreaInset) {
              contentSafeAreaTop = window.Telegram.WebApp.contentSafeAreaInset.top || 0;
          }

          // alert("safeAreaInset" + window.Telegram.WebApp.safeAreaInset);
          var safeAreaInset = window.Telegram.WebApp.safeAreaInset || { top: 0, left: 0, bottom: 0, right: 0 };
          var safeAreaToString = safeAreaInset.top.toString() + ',' +
              safeAreaInset.left.toString() + ',' +
              safeAreaInset.bottom.toString() + ',' +
              safeAreaInset.right.toString() + ',' +
              contentSafeAreaTop.toString();
         // alert("SafeAreaInsets string : " + safeAreaToString);
          MyGameInstance.SendMessage('TelegramService', 'ReceiveSafeAreaInsets', safeAreaToString);

          var telegramEnvironment = detectTelegramEnvironment();
          MyGameInstance.SendMessage('TelegramService', 'ReceiveAppEnvironment', telegramEnvironment);
      }
      
      document.body.appendChild(script);
    </script>
  </body>
</html>
